name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # bun.lock resolves packages from Lovable's private npm mirror, which
      # GitHub can't reach. Point this CI copy at the public registry (same
      # package versions); the committed lockfile is left untouched.
      - name: Use the public npm registry
        run: sed -i -E 's#https://[a-z0-9-]+-npm\.pkg\.dev/lovable-core-prod/sandbox-npm-cache/#https://registry.npmjs.org/#g' bun.lock

      - name: Install
        run: bun install --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Unit tests
        run: bunx vitest run --exclude src/lib/rls.test.ts --exclude src/lib/rpc-privileges.test.ts

      - name: Build
        run: bun run build

  live-security:
    # Confirms anonymous callers still can't read tenant tables or call
    # privileged functions on the live database (publishable key only, from .env).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: sed -i -E 's#https://[a-z0-9-]+-npm\.pkg\.dev/lovable-core-prod/sandbox-npm-cache/#https://registry.npmjs.org/#g' bun.lock
      - run: bun install --ignore-scripts
      - run: bunx vitest run src/lib/rls.test.ts src/lib/rpc-privileges.test.ts
